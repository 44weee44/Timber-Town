<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Карта — Timber Town</title>
</head>
<body data-screen="map">
  <header id="hud">
    <p id="wallet">Кошелёк <data id="money" value="1000">1 000$</data></p>
    <button type="button" id="open-inventory" aria-haspopup="dialog" aria-controls="inventory">Рюкзак</button>
    <a href="profile.html" id="open-profile">Профиль</a>
    <p id="clock"><time id="game-time" datetime="07:00">07:00</time></p>
  </header>
  <div id="toasts" aria-live="polite"></div>
  <template id="toast-template">
    <article class="toast" data-type="good">
      <p class="toast-text"></p>
      <button type="button" class="toast-close">Закрыть</button>
    </article>
  </template>
  <div id="processing" hidden role="alertdialog" aria-modal="true" aria-labelledby="processing-title">
    <p id="processing-title">Обработка...</p>
    <p id="processing-action"></p>
    <p id="processing-warning">НЕ ВЫХОДИТЕ ИЗ ИГРЫ, ПОКА ИДЁТ ОБРАБОТКА, ИНАЧЕ ДЕЙСТВИЕ НЕ СОХРАНИТСЯ</p>
  </div>
  <dialog id="inventory" aria-labelledby="inventory-title">
    <h2 id="inventory-title">Рюкзак</h2>
    <p id="inventory-empty">Пусто. Топоры продают в торговом центре.</p>
    <ul id="inventory-list"></ul>
    <button type="button" id="close-inventory">Закрыть</button>
  </dialog>
  <template id="axe-stack">
    <li data-rarity="" data-durability="">
      <span class="axe-name"></span>
      <span class="axe-count"></span>
      <span class="axe-durability"></span>
    </li>
  </template>
  <main id="map">
    <h1 hidden>Тимбер-Таун</h1>
    <p id="period" data-period="dawn" hidden>Рассвет. День <data id="day" value="1">1</data>.</p>
    <figure id="world">
      <img id="map-dawn" src="World_map_Sunrise.jpeg" alt="Карта Тимбер-Тауна на рассвете">
      <img id="map-day" src="World_map_day.jpeg" alt="Карта Тимбер-Тауна днём" hidden>
      <img id="map-dusk" src="World_map_Sunset.jpeg" alt="Карта Тимбер-Тауна на закате" hidden>
      <img id="map-night" src="World_map_Night.jpeg" alt="Карта Тимбер-Тауна ночью" hidden>
      <a href="sawmill.html" aria-label="Хвойный Кряж" data-spot="pine" style="left:20%;top:2%;width:24%;height:16%"></a>
      <a href="sawmill.html" aria-label="Дубовый Стан" data-spot="oak" style="left:76%;top:19%;width:22%;height:14%"></a>
      <a href="sawmill.html" aria-label="Склад леса" data-spot="yard" style="left:1%;top:32%;width:18%;height:16%"></a>
      <a href="sklad.html" aria-label="Склады" data-spot="wh" style="left:1%;top:51%;width:18%;height:16%"></a>
      <a href="shop.html" aria-label="Торговый центр" data-spot="shop" style="left:31%;top:33%;width:17%;height:16%"></a>
      <a href="uprava.html" aria-label="Управа" data-spot="hall" style="left:43%;top:49%;width:16%;height:18%"></a>
      <a href="master.html" aria-label="Мастерская" data-spot="ws" style="left:59%;top:35%;width:18%;height:14%"></a>
      <a href="liteynaya.html" aria-label="Литейная" data-spot="fn" style="left:71%;top:49%;width:18%;height:15%"></a>
      <a href="sawmill.html" aria-label="Берёзовый Ручей" data-spot="birch" style="left:70%;top:73%;width:22%;height:17%"></a>
    </figure>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
