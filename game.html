<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b140e">
  <link rel="stylesheet" href="style.css">
  <title>Карта — Timber Town</title>
  <style>
    /* Карта всегда вписывается в доступную область экрана без прокрутки.
       #world сохраняет aspect-ratio 3:2, а координаты hotspot масштабируются вместе с ним. */
    body[data-screen="map"] #map {
      overflow: hidden;
      padding: 0;
      min-width: 0;
      min-height: 0;
    }

    body[data-screen="map"] #world {
      width: min(100%, calc(100cqh * 1.5));
      height: auto;
      max-width: none;
      max-height: none;
      flex: 0 0 auto;
      aspect-ratio: 3 / 2;
    }

    body[data-screen="map"] #world img {
      object-fit: contain;
    }

    body[data-screen="map"] #world a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body[data-screen="map"] #world a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
      z-index: 2;
    }

    /* Заблокированные локации: клик доходит до обработчика,
       но визуально помечены как недоступные. */
    #world a[data-spot="pine"],
    #world a[data-spot="oak"] {
      pointer-events: auto;
      cursor: not-allowed;
    }

    /* Оверлей «Закрыто» — не перехватывает клики, но визуально
       предупреждает, что локация недоступна. */
    #world a[data-spot="pine"]::after,
    #world a[data-spot="oak"]::after {
      content: "";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--pixel);
      color: var(--cream);
      background: rgba(20, 14, 9, 0.55);
      border: 2px dashed rgba(244, 231, 200, 0.35);
      border-radius: 4px;
      text-shadow: 0 1px 0 var(--ink), 0 0 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    #world a[data-spot="pine"]:focus-visible::after,
    #world a[data-spot="oak"]:focus-visible::after {
      background: rgba(20, 14, 9, 0.72);
      border-color: var(--gold);
    }
  </style>
</head>
<body data-screen="map">
  <header id="hud">
    <p id="wallet"><span>Кошелёк</span> <data id="money" value="1000">1 000$</data></p>
    <button type="button" id="open-inventory" aria-haspopup="dialog" aria-controls="inventory"><span>Рюкзак</span></button>
    <a href="profile.html" id="open-profile">Профиль</a>
    <p id="clock"><time id="game-time" datetime="07:00">07:00</time></p>
  </header>
  <div id="toasts" aria-live="polite"></div>
  <template id="toast-template">
    <article class="toast" data-type="good">
      <p class="toast-text"></p>
      <button type="button" class="toast-close">Закрыть</button>
    </article>
  </template>
  <div id="processing" hidden role="alertdialog" aria-modal="true" aria-labelledby="processing-title">
    <p id="processing-title">Обработка...</p>
    <p id="processing-action"></p>
    <p id="processing-warning">НЕ ВЫХОДИТЕ ИЗ ИГРЫ, ПОКА ИДЁТ ОБРАБОТКА, ИНАЧЕ ДЕЙСТВИЕ НЕ СОХРАНИТСЯ</p>
  </div>
  <dialog id="inventory" aria-labelledby="inventory-title">
    <h2 id="inventory-title">Рюкзак</h2>
    <p id="inventory-empty">Пусто. Топоры продают в торговом центре.</p>
    <ul id="inventory-list"></ul>
    <button type="button" id="close-inventory">Закрыть</button>
  </dialog>
  <template id="axe-stack">
    <li data-rarity="" data-durability="">
      <span class="axe-name"></span>
      <span class="axe-count"></span>
      <span class="axe-durability"></span>
    </li>
  </template>
  <main id="map" aria-label="Тимбер-Таун">
    <h1 hidden>Тимбер-Таун</h1>
    <p id="period" data-period="dawn" hidden>Рассвет. День <data id="day" value="1">1</data>.</p>
    <figure id="world">
      <img id="map-dawn" src="karta.jpeg" alt="Карта Тимбер-Тауна">
      <a href="#" tabindex="0" aria-disabled="true" aria-label="Хвойный Кряж — закрытая территория" data-spot="pine" style="left:20%;top:2%;width:24%;height:16%"></a>
      <a href="#" tabindex="0" aria-disabled="true" aria-label="Дубовый Стан — закрытая территория" data-spot="oak" style="left:76%;top:19%;width:22%;height:14%"></a>
      <a href="sklad-lesa.html" aria-label="Склад леса" data-spot="yard" style="left:1%;top:32%;width:18%;height:16%"></a>
      <a href="sklad.html" aria-label="Склады" data-spot="wh" style="left:1%;top:51%;width:18%;height:16%"></a>
      <a href="shop.html" aria-label="Торговый центр" data-spot="shop" style="left:31%;top:33%;width:17%;height:16%"></a>
      <a href="uprava.html" aria-label="Управа" data-spot="hall" style="left:43%;top:49%;width:16%;height:18%"></a>
      <a href="master.html" aria-label="Мастерская" data-spot="ws" style="left:59%;top:35%;width:18%;height:14%"></a>
      <a href="liteynaya.html" aria-label="Литейная" data-spot="fn" style="left:71%;top:49%;width:18%;height:15%"></a>
      <a href="sawmill.html" aria-label="Берёзовый Ручей" data-spot="birch" style="left:70%;top:73%;width:22%;height:17%"></a>
    </figure>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="game.js" defer></script>
  <script>
    (() => {
      'use strict';

      // Заблокированные локации: перехватываем клик и показываем
      // понятный toast вместо перехода. Никакой навигации не происходит.
      document.addEventListener('click', event => {
        const locked = event.target.closest('#world a[aria-disabled="true"]');
        if (!locked) return;

        event.preventDefault();

        const label = locked.getAttribute('aria-label')
          || 'Эта локация закрыта.';
        window.TimberTown?.notify?.(label, 'error');
      });
    })();
  </script>
</body>
</html>
