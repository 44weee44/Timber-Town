<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#28231d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Timber Town">
  <link rel="stylesheet" href="style.css">
  <link rel="prefetch" href="game.html">
  <link rel="prefetch" href="game.js">
  <title>Timber Town</title>
  <style>
    body[data-screen="boot"] { min-height:100dvh; height:100dvh; overflow:hidden; background:#24201a; }
    body[data-screen="boot"]::before, body[data-screen="boot"]::after { content:none; }
    #boot-art { position:fixed; inset:0; z-index:0; width:100vw; height:100dvh; min-height:100dvh; object-fit:cover; object-position:center 42%; image-rendering:auto; pointer-events:none; }
    #boot { position:relative; z-index:1; min-height:100dvh; height:100dvh; }
    body[data-screen="boot"] #boot h1 { position:fixed; z-index:2; top:calc(env(safe-area-inset-top) + clamp(22px,6vh,56px)); left:16px; right:16px; width:auto; height:auto; margin:0; overflow:visible; clip:auto; color:#f0e3ca; font:clamp(25px,7vw,42px)/1.15 Georgia,serif; letter-spacing:.1em; text-align:center; text-shadow:0 2px 4px #18130f, 0 0 20px rgba(0,0,0,.5); }
    #boot-hud { position:fixed; z-index:3; left:50%; bottom:0; translate:-50% 0; width:min(540px, calc(100% - 28px)); display:grid; gap:9px; padding:18px 20px calc(17px + env(safe-area-inset-bottom)); color:#372c21; background:linear-gradient(145deg,rgba(239,228,205,.96),rgba(213,198,169,.96)); border:1px solid rgba(91,68,44,.72); box-shadow:0 12px 36px rgba(0,0,0,.34), inset 0 0 0 4px rgba(255,250,236,.28); }
    #boot-hud::before { content:"TIMBER TOWN  ·  ЛЕСНОЕ ХОЗЯЙСТВО"; display:block; padding-bottom:8px; border-bottom:1px solid rgba(91,68,44,.25); color:#78634a; font:10px/1.2 Georgia,serif; letter-spacing:.16em; text-align:center; }
    #loading-status { margin:0; color:#4c3b2b; font:16px/1.35 Georgia,serif; text-align:center; }
    #tip { margin:0; color:#78664f; font:13px/1.45 Georgia,serif; text-align:center; }
    #load-slot { height:7px; width:100%; overflow:hidden; background:rgba(75,57,39,.17); border:1px solid rgba(91,68,44,.26); box-shadow:inset 0 1px 2px rgba(42,30,19,.14); }
    #load-fill { display:block; width:0%; height:100%; background:linear-gradient(90deg,#9d7948,#c8a66b); transition:width .2s ease; }
    #load-bar, #load-pct, #load-readout, #boot-credit, #boot-divider, #tip-list { display:none !important; }
    body[data-screen="boot"] #play { position:relative; left:auto; bottom:auto; translate:none; width:100%; min-height:44px; margin:2px 0 0; border:1px solid #695036; border-radius:2px; background:#5b4935; color:#f5ead4; box-shadow:0 3px 0 #382b20; font:16px Georgia,serif; letter-spacing:.04em; text-transform:none; text-decoration:none; }
    body[data-screen="boot"] #play:active { transform:translateY(2px); box-shadow:0 1px 0 #382b20; }
    body[data-screen="boot"] #play[aria-disabled="true"] { opacity:.45; pointer-events:none; }
    #boot-storage-warning { margin:0; padding:8px 10px; border:1px solid #97645a; background:#f1ddd3; color:#713d32; font:12px/1.4 Georgia,serif; text-align:center; }
    @media (max-width:420px) {
      #boot-hud { width:calc(100% - 20px); gap:8px; padding:14px 14px calc(13px + env(safe-area-inset-bottom)); }
      #loading-status { font-size:15px; }
      #tip { font-size:12px; }
    }
    @media (prefers-reduced-motion:reduce) { #load-fill { transition:none; } }
    /* Cozy village loader — full artwork, quiet wooden welcome panel. */
    body[data-screen="boot"] { background:#20251b; color:#f1e7d1; }
    body[data-screen="boot"] #boot h1 { color:#f3e7cf; font-family:Georgia,serif; font-weight:700; letter-spacing:.14em; text-shadow:0 3px 12px rgba(0,0,0,.78); }
    #boot-hud { gap:11px; padding:20px 22px calc(18px + env(safe-area-inset-bottom)); color:#f1e7d1; background:linear-gradient(145deg,rgba(62,45,29,.96),rgba(38,29,20,.97)); border:1px solid rgba(193,151,91,.65); border-radius:12px; box-shadow:0 14px 38px rgba(0,0,0,.42),inset 0 1px rgba(255,235,194,.09); }
    #boot-hud::before { color:#c9ad7d; border-bottom:1px solid rgba(207,176,127,.25); font-family:"Trebuchet MS",Arial,sans-serif; letter-spacing:.18em; }
    #loading-status { color:#f1e7d1; font:600 17px/1.35 Georgia,serif; }
    #tip { color:#cbb998; font:13px/1.45 Georgia,serif; }
    #load-slot { height:7px; background:rgba(12,20,12,.72); border:1px solid rgba(192,161,111,.3); border-radius:20px; box-shadow:none; }
    #load-fill { background:linear-gradient(90deg,#627b48,#c9a15f); border-radius:20px; }
    body[data-screen="boot"] #play { min-height:46px; border:1px solid #82935a; border-radius:8px; background:linear-gradient(180deg,#647d49,#4e6738); color:#fff3da; box-shadow:0 3px 0 #28391f; font:700 15px/1.2 "Trebuchet MS",Arial,sans-serif; letter-spacing:.03em; }
    body[data-screen="boot"] #play:active { box-shadow:0 1px 0 #28391f; }
    #boot-storage-warning { border:1px solid #9e6755; border-radius:7px; background:#ead6c4; color:#653d2d; }
    @media (max-width:420px) { #boot-hud { padding:15px 15px calc(14px + env(safe-area-inset-bottom)); } }
  </style>
</head>
<body data-screen="boot">
  <img id="boot-art" src="loading.jpeg" width="1500" height="1007" alt="Лесной городок Timber Town">
  <main id="boot">
    <h1>TIMBER TOWN</h1>
    <div id="boot-hud">
      <p id="loading-status" role="status" aria-live="polite">Готовим ваш лесной городок…</p>
      <div id="load-slot" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="load-fill"></i></div>
      <p id="tip">Следите за запасом брёвен: дополнительный склад расширяется в магазине.</p>
      <p id="boot-storage-warning" hidden>Браузер не разрешил локальное сохранение. Прогресс может не сохраниться после закрытия игры.</p>
      <a href="game.html" id="play" role="button" aria-disabled="true" tabindex="-1">Подождите…</a>
    </div>
  </main>
  <noscript><p class="boot-noscript">Для запуска Timber Town необходимо включить JavaScript.</p></noscript>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (() => {
      'use strict';
      const play = document.getElementById('play');
      const status = document.getElementById('loading-status');
      const fill = document.getElementById('load-fill');
      const slot = document.getElementById('load-slot');
      const warning = document.getElementById('boot-storage-warning');
      const resources = [
        'style.css','game.js','game.html','profile.html','sawmill.html','shop.html',
        'sklad.html','sklad-lesa.html','uprava.html','master.html','liteynaya.html',
        'World_map_Sunrise.jpeg','World_map_day.jpeg','World_map_Sunset.jpeg','World_map_Night.jpeg',
        '1skin.jpeg','1axeskin.jpeg','2axeskin.jpeg','3axeskin.jpeg','4aceskin.jpeg','5axeskin.jpeg',
        'Backpack.jpeg','The_Board.jpeg','Trad_Center.jpeg','Warehouse.jpeg','loading.jpeg'
      ];
      const tg = window.Telegram?.WebApp;
      try { tg?.ready?.(); tg?.expand?.(); } catch (_) {}
      let done = 0;
      const paint = (label) => {
        const pct = Math.round(done / resources.length * 100);
        if (fill) fill.style.width = `${pct}%`;
        if (slot) slot.setAttribute('aria-valuenow', String(pct));
        if (status) status.textContent = label;
      };
      const check = path => new Promise(resolve => {
        if (/\.(?:jpe?g|png|webp|svg)$/i.test(path)) {
          const image = new Image();
          image.onload = image.onerror = () => { done++; resolve(); };
          image.src = path;
        } else {
          fetch(path, { cache:'no-store' }).catch(() => null).finally(() => { done++; resolve(); });
        }
      });
      const storageAvailable = (() => { try { localStorage.setItem('__tt_probe__','1'); localStorage.removeItem('__tt_probe__'); return true; } catch (_) { return false; } })();
      if (!storageAvailable && warning) warning.hidden = false;
      (async () => {
        const checks = resources.map((path, index) => check(path).then(() => {
          if (index === resources.length - 1 || done === resources.length) paint('Последние приготовления…');
          else if (done < 8) paint('Собираем игровой мир…');
          else paint('Проверяем лесопилку и сохранение…');
        }));
        await Promise.all(checks);
        await Promise.race([document.fonts?.ready || Promise.resolve(), new Promise(resolve => setTimeout(resolve, 900))]);
        if (fill) fill.style.width = '100%';
        if (slot) slot.setAttribute('aria-valuenow','100');
        if (status) status.textContent = storageAvailable ? 'Всё готово. Добро пожаловать в Timber Town.' : 'Мир готов. Проверьте предупреждение о сохранении.';
        if (play) { play.textContent='Войти в город'; play.setAttribute('aria-disabled','false'); play.removeAttribute('tabindex'); }
      })().catch(error => {
        console.warn('Loader fallback:', error);
        if (status) status.textContent = 'Почти готово. Можно войти в город.';
        if (play) { play.textContent='Войти в город'; play.setAttribute('aria-disabled','false'); play.removeAttribute('tabindex'); }
      });
    })();
  </script>
</body>
</html>
